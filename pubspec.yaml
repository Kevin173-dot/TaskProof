name: taskguard

description: "TaskProof mobile app for Android and iOS."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  camera_android: ^0.10.11

  google_mlkit_commons: ^0.12.0
  google_mlkit_pose_detection: ^0.15.0
  google_mlkit_face_detection: ^0.14.0
  google_mlkit_object_detection: ^0.16.0

  flutter:
    sdk: flutter

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  google_fonts: ^6.2.1

  path_provider: ^2.1.6
  image: ^4.9.1
  shared_preferences: ^2.5.5

dependency_overrides:
  camera_android_camerax: 0.7.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/TaskProof1.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/

  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
